[project]
name = "pli-api"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy[asyncio]>=2.0",
"asyncpg>=0.29",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "redis>=5.0",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "minio>=7.2",
  "email-validator>=2.1",
  "structlog>=24.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "jsonschema>=4.20"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "SIM", "DTZ"]
ignore = ["E501", "B008", "DTZ001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

