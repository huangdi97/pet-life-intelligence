# Staging reverse proxy (separate subdomains, isolated from production).
# Deployed on the staging host; production.conf lives beside this and is used
# on the production host. Domains below are placeholders — real DNS required
# (EXTERNAL_BLOCKED until provided).

server {
  listen 80;
  server_name staging.pli.example.com api-staging.pli.example.com admin-staging.pli.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name api-staging.pli.example.com;
  ssl_certificate /etc/nginx/certs/staging/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/staging/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  location / {
    proxy_pass http://api:8800;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl http2;
  server_name staging.pli.example.com;
  ssl_certificate /etc/nginx/certs/staging/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/staging/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  location / {
    proxy_pass http://web:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl http2;
  server_name admin-staging.pli.example.com;
  ssl_certificate /etc/nginx/certs/staging/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/staging/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  location / {
    proxy_pass http://admin:3200;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}