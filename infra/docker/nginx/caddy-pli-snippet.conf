# === PLI (Pet Life Intelligence) ===
  # API: strip /pli-api so upstream sees /api/v1/...
  handle_path /pli-api/* {
    reverse_proxy 127.0.0.1:18800
  }
  # Admin: basePath=/pli-admin, upstream expects full path (match /pli-admin and /pli-admin/*)
  handle /pli-admin /pli-admin/* {
    reverse_proxy 127.0.0.1:13200
  }
  # Web: basePath=/pli, upstream expects full path (match /pli and /pli/*)
  handle /pli /pli/* {
    reverse_proxy 127.0.0.1:13100
  }
  # === end PLI ===