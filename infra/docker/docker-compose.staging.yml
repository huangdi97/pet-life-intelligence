# PLI staging compose — isolated DB/Redis/volumes from production.
# Usage:
#   docker compose -f infra/docker/docker-compose.staging.yml --env-file .env.staging up -d

services:
  api:
    image: pli-api:1.1.0-stage-e
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.api
    env_file:
      - path: ../../.env.staging
        required: false
    environment:
      JSON_LOGS_ENABLED: "true"
      DB_POOL_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [pli-staging]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8800/api/v1/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    image: pli-worker:1.1.0-stage-e
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.worker
    env_file:
      - path: ../../.env.staging
        required: false
    command: ["python", "worker/main.py", "--loop", "60"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [pli-staging]

  web:
    image: pli-web:1.1.0-stage-e
    build:
      context: ../../apps/web
      dockerfile: ../../infra/docker/Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: https://api-staging.pli.example.com
    restart: unless-stopped
    networks: [pli-staging]

  admin:
    image: pli-admin:1.1.0-stage-e
    build:
      context: ../../apps/admin
      dockerfile: ../../infra/docker/Dockerfile.admin
    environment:
      NEXT_PUBLIC_API_URL: https://api-staging.pli.example.com
    restart: unless-stopped
    networks: [pli-staging]

  reverse-proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on: [api, web, admin]
    restart: unless-stopped
    networks: [pli-staging]

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.staging}
      POSTGRES_DB: ${POSTGRES_DB:-pli_staging}
    volumes:
      - pli_staging_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pli} -d $${POSTGRES_DB:-pli_staging}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [pli-staging]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - pli_staging_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [pli-staging]

volumes:
  pli_staging_postgres:
  pli_staging_redis:

networks:
  pli-staging:
    driver: bridge