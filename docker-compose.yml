services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pli
      POSTGRES_PASSWORD: pli_dev_password
      POSTGRES_DB: pli
    ports:
      # host 5432 occupied by other local projects; PLI uses 55432
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pli -d pli"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pli_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      # host 6379 occupied by other local projects; PLI uses 56379
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pli_minio
      MINIO_ROOT_PASSWORD: pli_minio_dev_secret
    ports:
      # host 9000/9001 occupied by other local projects; PLI uses 59000/59001
      - "59000:9000"
      - "59001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pli_minio:/data

volumes:
  pli_postgres:
  pli_minio:
