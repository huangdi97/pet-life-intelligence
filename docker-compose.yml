services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pli
      POSTGRES_PASSWORD: pli_dev_password
      POSTGRES_DB: pli
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pli -d pli"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pli_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pli_minio
      MINIO_ROOT_PASSWORD: pli_minio_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - pli_minio:/data

volumes:
  pli_postgres:
  pli_minio:
