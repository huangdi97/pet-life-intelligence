<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLI v0.1.2 - Android Emulator 最终验收截图（16 屏）</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #eceff3; color: #1a1f26; font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
  header { background: #0e2433; color: #fff; padding: 24px 26px 20px; }
  header h1 { margin: 0 0 6px; font-size: 21px; }
  header p { margin: 0; font-size: 13px; color: #b9cdd8; }
  header code { color: #7fd4ae; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; padding: 22px; max-width: 1400px; margin: 0 auto; }
  figure { margin: 0; background: #fff; border: 1px solid #d8dee5; border-radius: 8px; overflow: hidden; cursor: zoom-in; }
  .thumb { aspect-ratio: 1080 / 2340; background: #f6f8fa; }
  .thumb img { display: block; width: 100%; height: 100%; object-fit: contain; }
  figcaption { padding: 9px 11px; border-top: 1px solid #e6eaef; }
  .page { display: block; font-size: 14px; font-weight: 600; color: #14324a; }
  .file { display: block; font-size: 11px; color: #7a8792; word-break: break-all; margin-top: 2px; }
  #lb { position: fixed; inset: 0; background: rgba(8,12,16,.94); display: none; align-items: flex-start; justify-content: center; overflow: auto; padding: 22px; z-index: 100; cursor: zoom-out; }
  #lb.open { display: flex; }
  #lb .stage { max-width: 560px; width: 100%; cursor: default; }
  #lb img { display: block; width: 100%; height: auto; background: #fff; }
  #lb .cap { background: #fff; padding: 9px 12px; font-size: 13px; color: #14324a; }
  #lb .cap .file { color: #7a8792; font-size: 11px; word-break: break-all; }
  #lb .hint { color: #93a7b4; font-size: 12px; padding: 8px 2px 0; }
</style>
</head>
<body>
<header>
  <h1>PLI v0.1.2 &mdash; Android Emulator 最终验收截图（16 屏）</h1>
  <p>来源：<code>artifacts/emulator/v0.1.2/</code>（Stage R.1-E 最终验收 16 屏真实模拟器截图，v0.1.2 APK + 本地后端 10.0.2.2:8800，二进制安全重截）。点击缩略图查看原始分辨率；纯本地页面，无需联网。</p>
</header>
<main>
  <figure data-src="../01_login.png"><div class="thumb"><img src="../01_login.png" alt="01 Login"></div><figcaption><span class="page">01 Login</span><span class="file">01_login.png</span></figcaption></figure>
  <figure data-src="../02_today.png"><div class="thumb"><img src="../02_today.png" alt="02 Today"></div><figcaption><span class="page">02 Today</span><span class="file">02_today.png</span></figcaption></figure>
  <figure data-src="../03_quick-log.png"><div class="thumb"><img src="../03_quick-log.png" alt="03 Quick Log"></div><figcaption><span class="page">03 Quick Log</span><span class="file">03_quick-log.png</span></figcaption></figure>
  <figure data-src="../04_timeline.png"><div class="thumb"><img src="../04_timeline.png" alt="04 Timeline"></div><figcaption><span class="page">04 Timeline</span><span class="file">04_timeline.png</span></figcaption></figure>
  <figure data-src="../05_pet.png"><div class="thumb"><img src="../05_pet.png" alt="05 Pet / PetHub"></div><figcaption><span class="page">05 Pet / PetHub</span><span class="file">05_pet.png</span></figcaption></figure>
  <figure data-src="../06_3d-life-view.png"><div class="thumb"><img src="../06_3d-life-view.png" alt="06 3D Life View"></div><figcaption><span class="page">06 3D Life View</span><span class="file">06_3d-life-view.png</span></figcaption></figure>
  <figure data-src="../07_health.png"><div class="thumb"><img src="../07_health.png" alt="07 Health"></div><figcaption><span class="page">07 Health</span><span class="file">07_health.png</span></figcaption></figure>
  <figure data-src="../08_behavior.png"><div class="thumb"><img src="../08_behavior.png" alt="08 Behavior"></div><figcaption><span class="page">08 Behavior</span><span class="file">08_behavior.png</span></figcaption></figure>
  <figure data-src="../09_training.png"><div class="thumb"><img src="../09_training.png" alt="09 Training"></div><figcaption><span class="page">09 Training</span><span class="file">09_training.png</span></figcaption></figure>
  <figure data-src="../10_welfare.png"><div class="thumb"><img src="../10_welfare.png" alt="10 Welfare"></div><figcaption><span class="page">10 Welfare</span><span class="file">10_welfare.png</span></figcaption></figure>
  <figure data-src="../11_social.png"><div class="thumb"><img src="../11_social.png" alt="11 Social"></div><figcaption><span class="page">11 Social</span><span class="file">11_social.png</span></figcaption></figure>
  <figure data-src="../12_assistant.png"><div class="thumb"><img src="../12_assistant.png" alt="12 Assistant"></div><figcaption><span class="page">12 Assistant</span><span class="file">12_assistant.png</span></figcaption></figure>
  <figure data-src="../13_companion.png"><div class="thumb"><img src="../13_companion.png" alt="13 Companion"></div><figcaption><span class="page">13 Companion</span><span class="file">13_companion.png</span></figcaption></figure>
  <figure data-src="../14_me.png"><div class="thumb"><img src="../14_me.png" alt="14 Me"></div><figcaption><span class="page">14 Me</span><span class="file">14_me.png</span></figcaption></figure>
  <figure data-src="../15_pet-switch.png"><div class="thumb"><img src="../15_pet-switch.png" alt="15 Pet Switch"></div><figcaption><span class="page">15 Pet Switch</span><span class="file">15_pet-switch.png</span></figcaption></figure>
  <figure data-src="../16_error-offline.png"><div class="thumb"><img src="../16_error-offline.png" alt="16 Offline / Error"></div><figcaption><span class="page">16 Offline / Error</span><span class="file">16_error-offline.png</span></figcaption></figure>
</main>
<div id="lb" role="dialog" aria-label="原始分辨率截图预览">
  <div class="stage">
    <img id="lbImg" alt="">
    <div class="cap"><span id="lbPage"></span><div class="file" id="lbFile"></div></div>
    <div class="hint">滚动/拖动查看原始尺寸 &middot; 点击图片外区域或按 Esc 关闭</div>
  </div>
</div>
<script>
(function () {
  var box = document.getElementById('lb');
  var img = document.getElementById('lbImg');
  var pg = document.getElementById('lbPage');
  var fl = document.getElementById('lbFile');
  function close() { box.classList.remove('open'); img.removeAttribute('src'); }
  document.querySelectorAll('figure').forEach(function (f) {
    f.addEventListener('click', function () {
      img.src = f.getAttribute('data-src');
      pg.textContent = f.querySelector('.page').textContent;
      fl.textContent = f.querySelector('.file').textContent;
      box.classList.add('open');
      box.scrollTop = 0;
    });
  });
  box.addEventListener('click', function (e) { if (e.target === box || e.target === img) close(); });
  img.addEventListener('click', close);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
})();
</script>
</body>
</html>
