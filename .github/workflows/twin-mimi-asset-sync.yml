name: Mimi GLB Animation Sync

on:
  pull_request:
    paths:
      - "scripts/r2p3d-r4/glbwriter.py"
      - "packages/pet-3d/assets/twins/mimi_weights.json"
      - ".github/workflows/twin-mimi-asset-sync.yml"

concurrency:
  group: twin-mimi-asset-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-mimi:
    name: Rebuild Mimi GLB with canonical animation semantics
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/r2p3d-r3-render-truth-ui-closure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic build dependencies
        run: pip install numpy pillow
      - name: Rebuild Mimi GLB and verify product assets
        run: |
          python scripts/r2p3d-r4/build_twins.py --identity cat
          cp packages/pet-3d/assets/twins/mimi.glb apps/web/public/assets/twins/mimi.glb
          python scripts/twin/twin_glb_qa.py
          python scripts/twin/product_twin_qa.py
      - name: Commit deterministic generated asset delta
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet --             packages/pet-3d/assets/twins/mimi.glb             packages/pet-3d/assets/twins/mimi.glb.manifest.json             apps/web/public/assets/twins/mimi.glb; then
            echo "Mimi generated GLB already matches the canonical generator."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             packages/pet-3d/assets/twins/mimi.glb             packages/pet-3d/assets/twins/mimi.glb.manifest.json             apps/web/public/assets/twins/mimi.glb
          git commit -m "fix(3d): regenerate Mimi with bind-relative animation tracks"
          git push origin "HEAD:${BRANCH}"
