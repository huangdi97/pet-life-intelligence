name: Twin Asset Deterministic Sync

on:
  pull_request:
    paths:
      - "scripts/r2p3d-r4/**"
      - "packages/pet-3d/assets/twins/**"
      - "apps/web/public/assets/twins/**"
      - ".github/workflows/twin-asset-sync.yml"

concurrency:
  group: twin-asset-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-doudou:
    name: Regenerate Doudou from canonical source
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/r2p3d-r3-render-truth-ui-closure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic bake dependencies
        run: pip install numpy pillow
      - name: Regenerate Doudou skin, atlas, GLB and manifest
        run: |
          python scripts/r2p3d-r4/bake_twin.py --identity dog
          python scripts/r2p3d-r4/build_twins.py --identity dog
          cp packages/pet-3d/assets/twins/doudou.glb apps/web/public/assets/twins/doudou.glb
          python scripts/twin/twin_glb_qa.py
          python scripts/twin/product_twin_qa.py
      - name: Commit deterministic generated asset delta
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet --             packages/pet-3d/assets/twins/doudou_base.obj             packages/pet-3d/assets/twins/doudou_baseColor.png             packages/pet-3d/assets/twins/doudou_observed.png             packages/pet-3d/assets/twins/doudou_inferred.png             packages/pet-3d/assets/twins/doudou_weights.json             packages/pet-3d/assets/twins/doudou_meta.json             packages/pet-3d/assets/twins/doudou.glb             packages/pet-3d/assets/twins/doudou.glb.manifest.json             apps/web/public/assets/twins/doudou.glb; then
            echo "Doudou generated assets already match the canonical pipeline."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             packages/pet-3d/assets/twins/doudou_base.obj             packages/pet-3d/assets/twins/doudou_baseColor.png             packages/pet-3d/assets/twins/doudou_observed.png             packages/pet-3d/assets/twins/doudou_inferred.png             packages/pet-3d/assets/twins/doudou_weights.json             packages/pet-3d/assets/twins/doudou_meta.json             packages/pet-3d/assets/twins/doudou.glb             packages/pet-3d/assets/twins/doudou.glb.manifest.json             apps/web/public/assets/twins/doudou.glb
          git commit -m "fix(3d): regenerate Doudou with corrected skin bind"
          git push origin "HEAD:${BRANCH}"
