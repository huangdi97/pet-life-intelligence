name: Doudou Boundary-Preserving Asset Sync

on:
  pull_request:
    paths:
      - "scripts/r2p3d-r4/meshops.py"
      - "scripts/r2p3d-r4/bake_twin.py"
      - "scripts/r2p3d-r4/skinweights.py"
      - "packages/pet-3d/assets/twins/doudou_*"
      - ".github/workflows/twin-doudou-boundary-sync.yml"

concurrency:
  group: twin-doudou-boundary-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-doudou:
    name: Rebuild Doudou without native-shell shrinkage
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/r2p3d-r3-render-truth-ui-closure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic build dependencies
        run: pip install numpy pillow
      - name: Rebuild Doudou from native source
        run: |
          python scripts/r2p3d-r4/bake_twin.py --identity dog
          python scripts/r2p3d-r4/build_twins.py --identity dog
          cp packages/pet-3d/assets/twins/doudou.glb apps/web/public/assets/twins/doudou.glb
          python scripts/twin/twin_glb_qa.py
          python scripts/twin/product_twin_qa.py
      - name: Commit deterministic generated asset delta
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- \
            packages/pet-3d/assets/twins/doudou_base.obj \
            packages/pet-3d/assets/twins/doudou_baseColor.png \
            packages/pet-3d/assets/twins/doudou_observed.png \
            packages/pet-3d/assets/twins/doudou_inferred.png \
            packages/pet-3d/assets/twins/doudou_weights.json \
            packages/pet-3d/assets/twins/doudou_meta.json \
            packages/pet-3d/assets/twins/doudou.glb \
            packages/pet-3d/assets/twins/doudou.glb.manifest.json \
            apps/web/public/assets/twins/doudou.glb; then
            echo "Doudou generated assets already match the boundary-preserving pipeline."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/pet-3d/assets/twins/doudou_base.obj \
            packages/pet-3d/assets/twins/doudou_baseColor.png \
            packages/pet-3d/assets/twins/doudou_observed.png \
            packages/pet-3d/assets/twins/doudou_inferred.png \
            packages/pet-3d/assets/twins/doudou_weights.json \
            packages/pet-3d/assets/twins/doudou_meta.json \
            packages/pet-3d/assets/twins/doudou.glb \
            packages/pet-3d/assets/twins/doudou.glb.manifest.json \
            apps/web/public/assets/twins/doudou.glb
          git commit -m "fix(3d): regenerate Doudou without native shell shrinkage"
          git push origin "HEAD:${BRANCH}"
